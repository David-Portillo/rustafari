[package]
name = "rustafari-core"
description = "The library behind the rustafari desktop app: offline developer utilities — JSON/YAML/XML diffing and formatting, Base64, URL encoding, hashing, UUIDs, cron"
keywords = ["devtools", "json", "diff", "base64", "hash"]
categories = ["development-tools", "encoding", "value-formatting", "text-processing"]
readme = "README.md"
documentation = "https://docs.rs/rustafari-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
percent-encoding = "2"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
serde_norway = "0.9"
roxmltree = "0.21"
