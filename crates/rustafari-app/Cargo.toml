[package]
name = "rustafari"
description = "Swiss Army knife devtoy for Rustaceans — offline developer utilities in a single native app"
keywords = ["devtools", "gui", "json", "developer", "utilities"]
categories = ["development-tools", "gui", "command-line-utilities"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "rustafari"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustafari-core = { path = "../rustafari-core", version = "0.8.0" }
# `default-features = false` keeps the webview and the accesskit/wgpu extras
# out; glow gives us a plain OpenGL window and nothing else. `default_fonts`
# is deliberately absent: we ship our own (see fonts.rs), which is both
# lighter and better looking than egui's bundled set.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
